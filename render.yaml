services:
  - type: web
    name: recipe-craft-ai
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/app.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase: recipe-craft-ai-db
      - key: OPENAI_API_KEY
        fromFile: .env
